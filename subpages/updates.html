<div class="three-col-cell">
    <div id = "Blog"></div>
    <script>
        fetch('https://api.github.com/gists/b838ac271c69ed55189fb11ad9d5d7e5')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            for (let filename in data.files)
            {
                let file = data.files[filename]
                let content = JSON.parse(file.content)

                content.forEach(update => {
                    let description = update.description || '';
    
                    let element = `
                        <div id="infoBubble">
                            <div id="infoBubble_Header">
                                ${update.title}
                            </div>
                            <div id="infoBubble_Tags">                        
                                <img src="images/Icons14.png"/> 
                                <div id="infoBubble_Tag">${update.date}</div>
                                <div id="infoBubble_Tag">Type: ${update.type}</div>
                            </div>
                    `;
    
                    if (description) {
                        element += `
                            <div id="infoBubble_Requirements">
                                <hr/>
                                ${description}
                            </div>
                        `;
                    }
    
                    element += "</div>";
    
                    $('#Blog').append(element);
                });
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
        });
        
    </script>
    <br/>
    <br/>
    <br/>        
</div>
